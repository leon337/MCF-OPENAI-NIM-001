name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit report
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-audit.json", "utf8"));
            const vulnerabilities = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via || []).map((entry) => typeof entry === "string" ? entry : ({
                title: entry.title,
                url: entry.url,
                range: entry.range
              }))
            }));
            console.log(JSON.stringify({ totals: report.metadata?.vulnerabilities, vulnerabilities }, null, 2));
          '
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
